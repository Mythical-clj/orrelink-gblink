name = "orrelink-hub"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Created once with:  npx wrangler kv namespace create TEAMS   (paste the id below)
[[kv_namespaces]]
binding = "TEAMS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Dolphin's public netplay session index, which OrreLink hosts publish to.
INDEX_URL = "https://lobby.dolphin-emu.org"
