name: Publish test release

# Copies the build artifacts of an earlier "Build XD Netplay" run into a GitHub pre-release, so
# testers can download them without a GitHub login.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Build XD Netplay run to publish"
        required: true
      artifact:
        description: "Artifact name, e.g. dolphin-xd-netplay-macos"
        required: true
      tag:
        description: "Release tag, e.g. mac-test-1"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download the artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n "${{ inputs.artifact }}" -D dl
          ls -laR dl
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dl
          # Re-zip so the download is one file, whatever the artifact held.
          zip -qr "../${{ inputs.artifact }}.zip" .
          cd ..
          gh release create "${{ inputs.tag }}" "${{ inputs.artifact }}.zip" \
            -R "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "${{ inputs.tag }}" \
            --notes "Test build (run ${{ inputs.run_id }}). Not signed or notarized."
